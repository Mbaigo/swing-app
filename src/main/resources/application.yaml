server:
  port: 8088
# Nom de l'application
spring:
  application:
    name: swingApp
  # Connexion DB (Doit correspondre au docker-compose.yml)
  datasource:
    url: jdbc:postgresql://localhost:5432/couture_erp
    username: dev_user
    password: dev_password
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate
  jpa:
    database: POSTGRESQL
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # "update" mettra à jour le schéma automatiquement (pratique en dev)
      ddl-auto: update
    # Affiche les requêtes SQL dans la console (pour débugger)
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Java 21 Performance (Virtual Threads)
  threads:
    virtual:
      enabled: true
  rsocket:
    server:
      port: 8088

      # Configuration de la sécurité (Resource Server)
  security:
    oauth2:
      resourceserver:
        jwt:
          # C'est l'URL exacte de ton Realm.
          # Spring Boot va appeler cette URL au démarrage pour récupérer les clés publiques de Keycloak.
          issuer-uri: http://localhost:9090/realms/lex-couture
  # Configuration Swagger (Pour pouvoir envoyer le token via l'interface)
springdoc:
  swagger-ui:
    path: /swagger-ui.html